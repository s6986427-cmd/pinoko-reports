name: 全量業績更新

on:
  schedule:
    # 台北時間 01:07（UTC 17:07），避開整點尖峰；主要觸發改由 cron-job.org 呼叫 workflow_dispatch，這裡只當備援
    - cron: '7 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 跟今日銷售共用同一組，避免兩個流程同時 force push
concurrency:
  group: pinoko-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝套件
        run: npm install

      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install chromium --with-deps

      - name: 執行全量更新
        env:
          USHOW_ACCOUNT: ${{ secrets.USHOW_ACCOUNT }}
          USHOW_PASSWORD: ${{ secrets.USHOW_PASSWORD }}
        run: node update_pinoko.js full

      - name: Commit 並推送
        run: |
          git config user.name "pinoko-bot"
          git config user.email "bot@pinoko.local"
          git add -A
          git diff --staged --quiet || git commit -m "自動全量更新 $(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M')"
          git push --force
